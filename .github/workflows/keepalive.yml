name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping progetto Supabase (anti-pausa free tier)
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" "${{ vars.SUPABASE_URL }}/rest/v1/state?select=user_id&limit=1" -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}"
      - name: Avviso se le variabili non sono impostate
        if: vars.SUPABASE_URL == '' || vars.SUPABASE_ANON_KEY == ''
        run: echo "::warning title=Keepalive disattivato::Imposta SUPABASE_URL e SUPABASE_ANON_KEY nelle Actions variables del repo (Settings -> Secrets and variables -> Actions -> Variables)."
